<!-- KXchat Inline Diagnostic Widget -->
<style>
#kxchat-diagnostic {
  position: fixed;
  top: 20px;
  left: 20px;
  width: 400px;
  max-height: 600px;
  background: #0d1117;
  border: 2px solid #58a6ff;
  border-radius: 8px;
  color: #c9d1d9;
  font-family: 'Courier New', monospace;
  font-size: 11px;
  line-height: 1.4;
  z-index: 999999;
  overflow-y: auto;
  padding: 10px;
  box-shadow: 0 0 20px rgba(88, 166, 255, 0.3);
}
#kxchat-diagnostic-close {
  position: absolute;
  top: 5px;
  right: 5px;
  background: #58a6ff;
  color: #0d1117;
  border:none;
  border-radius: 3px;
  cursor: pointer;
  padding: 2px 6px;
  font-weight: bold;
}
#kxchat-diagnostic-title {
  color: #58a6ff;
  font-weight: bold;
  margin-bottom: 10px;
  border-bottom: 1px solid #30363d;
  padding-bottom: 8px;
}
.diag-success { color: #3fb950; }
.diag-error { color: #f85149; }
.diag-warn { color: #d29922; }
.diag-info { color: #8b949e; }
.diag-line { margin: 3px 0; }
</style>

<div id="kxchat-diagnostic">
  <button id="kxchat-diagnostic-close">✕</button>
  <div id="kxchat-diagnostic-title">KXchat Diagnostics</div>
  <div id="kxchat-diagnostic-content"></div>
</div>

<script>
(function() {
  const diagDiv = document.getElementById('kxchat-diagnostic');
  const diagContent = document.getElementById('kxchat-diagnostic-content');
  const closeBtn = document.getElementById('kxchat-diagnostic-close');

  let checks = [];

  function log(text, type = 'info') {
    checks.push({ text, type });
    render();
  }

  function render() {
    let html = '';
    checks.forEach(c => {
      let className = '';
      if (c.type === 'success') className = 'diag-success';
      else if (c.type === 'error') className = 'diag-error';
      else if (c.type === 'warn') className = 'diag-warn';
      else className = 'diag-info';

      html += `<div class="diag-line ${className}">${escapeHtml(c.text)}</div>`;
    });
    diagContent.innerHTML = html;
    diagContent.scrollTop = diagContent.scrollHeight;
  }

  function escapeHtml(text) {
    const div = document.createElement('div');
    div.textContent = text;
    return div.innerHTML;
  }

  closeBtn.onclick = () => {
    diagDiv.style.display = 'none';
  };

  // Run diagnostics
  log('=== KXchat Status ===');

  // Check file loads
  const stylesheets = Array.from(document.styleSheets);
  const cssLoaded = stylesheets.some(s => s.href && s.href.includes('kxchat-widget.css'));
  log(cssLoaded ? '✓ CSS loaded' : '✗ CSS NOT loaded', cssLoaded ? 'success' : 'error');

  const scripts = Array.from(document.scripts);
  const configLoaded = scripts.some(s => s.src && s.src.includes('kxchat-config.js'));
  log(configLoaded ? '✓ Config loaded' : '✗ Config NOT loaded', configLoaded ? 'success' : 'error');

  const widgetLoaded = scripts.some(s => s.src && s.src.includes('kxchat-widget.js'));
  log(widgetLoaded ? '✓ Widget JS loaded' : '✗ Widget JS NOT loaded', widgetLoaded ? 'success' : 'error');

  // Check globals
  log('');
  log('=== Globals ===');
  log(window.KXCHAT_CONFIG ? 'window.KXCHAT_CONFIG: loaded' : '✗ KXCHAT_CONFIG missing', window.KXCHAT_CONFIG ? 'success' : 'error');
  log(window.KXchatWidget ? 'window.KXchatWidget: true' : '✗ KXchatWidget not set', window.KXchatWidget ? 'success' : 'error');

  // Check DOM elements
  log('');
  log('=== DOM Elements ===');

  const launcher = document.getElementById('kxchat-launcher');
  const widget = document.getElementById('kxchat-widget');
  const all = document.querySelectorAll('[id^="kxchat"]');

  log(launcher ? '✓ Launcher found' : '✗ Launcher NOT found', launcher ? 'success' : 'error');
  log(widget ? '✓ Widget found' : '✗ Widget NOT found', widget ? 'success' : 'error');
  log(`Found ${all.length} total KXchat elements`, all.length > 0 ? 'success' : 'error');

  if (all.length > 0) {
    log('');
    log('=== Elements List ===');
    all.forEach((el, i) => {
      log(`${i}: <${el.tagName}> id="${el.id}"`);
    });
  }

  // Check styles if widgets exist
  if (launcher || widget) {
    log('');
    log('=== Computed Styles ===');

    if (launcher) {
      const cs = getComputedStyle(launcher);
      log(`Launcher: display=${cs.display}, opacity=${cs.opacity}`);
      const visible = cs.display !== 'none' && cs.visibility !== 'hidden' && parseFloat(cs.opacity) > 0;
      if (!visible) {
        log('⚠ Launcher is hidden or invisible', 'warn');
      }
    }

    if (widget) {
      const cs = getComputedStyle(widget);
      log(`Widget: display=${cs.display}, opacity=${cs.opacity}`);
      const visible = cs.display !== 'none' && cs.visibility !== 'hidden' && parseFloat(cs.opacity) > 0;
      if (!visible) {
        log('  (widget should be hidden on init)', 'info');
      }
    }
  }

  // Root cause analysis
  log('');
  log('=== Root Cause Analysis ===');

  if (all.length === 0) {
    log('CRITICAL: No KXchat DOM nodes', 'error');
    if (!window.KXchatWidget) {
      log('→ Script did not execute (init not called)', 'error');
    } else if (!launcher && !widget) {
      log('→ createWidget() did not create elements', 'error');
    }
  } else if (!launcher) {
    log('CRITICAL: Launcher not in DOM', 'error');
  } else if (!widget) {
    log('CRITICAL: Widget not in DOM', 'error');
  } else {
    log('✓ Both elements present in DOM', 'success');
    const lcs = getComputedStyle(launcher);
    const isLauncherVisible = lcs.display !== 'none' && lcs.visibility !== 'hidden';
    if (isLauncherVisible) {
      log('✓ Launcher should be visible', 'success');
    } else {
      log('✗ Launcher is not visible', 'error');
    }
  }

})();
</script>
