<svg xmlns="http://www.w3.org/2000/svg" width="2241" height="967" viewBox="0 0 2241 967" shape-rendering="geometricPrecision">
  <defs>
    <style>
      #keisMark {
        transform-box: fill-box;
        transform-origin: 50% 50%;
        animation: keisSpin3D 4.2s linear infinite;
        will-change: transform, filter;
      }

      @keyframes keisSpin3D {

        /* СТАРТ / ПОКОЙ */
        0%, 10% {
          transform: scaleX(1) skewY(0deg);
          filter: brightness(1) contrast(1)
                  drop-shadow(0 6px 4px rgba(0,0,0,.32));
        }

        /* РАЗГОН */
        17% {
          transform: scaleX(.62) skewY(-2deg);
          filter: brightness(.94) contrast(1.04)
                  drop-shadow(4px 6px 5px rgba(0,0,0,.34));
        }

        /* ПЕРВОЕ РЕБРО */
        24% {
          transform: scaleX(.16) skewY(-4deg);
          filter: brightness(.68) contrast(1.12)
                  drop-shadow(9px 6px 7px rgba(0,0,0,.42));
        }

        /* ОБРАТНАЯ СТОРОНА */
        32% {
          transform: scaleX(-1) skewY(0deg);
          filter: brightness(.9) contrast(1.06)
                  drop-shadow(0 6px 4px rgba(0,0,0,.32));
        }

        /* ВТОРОЕ РЕБРО */
        40% {
          transform: scaleX(-.16) skewY(4deg);
          filter: brightness(.68) contrast(1.12)
                  drop-shadow(-9px 6px 7px rgba(0,0,0,.42));
        }

        /* ВОЗВРАТ */
        48% {
          transform: scaleX(.62) skewY(2deg);
          filter: brightness(.94) contrast(1.04)
                  drop-shadow(-4px 6px 5px rgba(0,0,0,.34));
        }

        /* ЛЁГКИЙ ПЕРЕЗАХОД */
        56% {
          transform: scaleX(1.08) skewY(0deg);
          filter: brightness(1.06) contrast(1.04)
                  drop-shadow(-2px 7px 5px rgba(0,0,0,.34));
        }

        /* МЯГКИЙ ОТКАТ */
        62% {
          transform: scaleX(.96) skewY(0deg);
          filter: brightness(.98) contrast(1.02)
                  drop-shadow(1px 6px 4px rgba(0,0,0,.32));
        }

        /* ФИКСАЦИЯ В ИСХОДНОМ ПОЛОЖЕНИИ + ДЛИННАЯ ПАУЗА */
        68%, 100% {
          transform: scaleX(1) skewY(0deg);
          filter: brightness(1) contrast(1)
                  drop-shadow(0 6px 4px rgba(0,0,0,.32));
        }
      }
    </style>

    <linearGradient id="whiteMetal" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="45%" stop-color="#f1f2f3"/>
      <stop offset="100%" stop-color="#c9ccd0"/>
    </linearGradient>

    <linearGradient id="orangeMetal" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f4af6b"/>
      <stop offset="55%" stop-color="#dc8a45"/>
      <stop offset="100%" stop-color="#bd652b"/>
    </linearGradient>

    <filter id="softDepth" x="-8%" y="-8%" width="116%" height="116%">
      <feDropShadow dx="0" dy="6" stdDeviation="4" flood-color="#000000" flood-opacity="0.32"/>
    </filter>
  </defs>

  <g filter="url(#softDepth)">

    <!-- АНИМИРОВАННАЯ БУКВА К С РАМКОЙ -->
    <g id="keisMark">
      <path fill="url(#whiteMetal)" d="
        M 2 2
        H 721
        L 650 68
        H 74
        V 651
        H 492
        L 560 718
        H 2
        Z
      "/>

      <rect x="172" y="131" width="92" height="452" fill="url(#orangeMetal)"/>

      <path fill="url(#whiteMetal)" d="
        M 608 127
        H 724
        L 429 383
        L 780 718
        H 668
        L 313 384
        Z
      "/>
    </g>

    <!-- Е -->
    <path fill="url(#whiteMetal)" d="
      M 798 226
      H 1200
      V 290
      H 866
      V 386
      H 1175
      V 452
      H 866
      V 552
      H 1200
      V 618
      H 798
      Z
    "/>

    <!-- Й / И -->
    <path fill="url(#whiteMetal)" d="
      M 1304 226
      H 1370
      V 524
      L 1683 226
      H 1740
      V 618
      H 1674
      V 330
      L 1370 618
      H 1304
      Z
    "/>

    <!-- Верхний оранжевый знак Й -->
    <path fill="url(#orangeMetal)" d="
      M 1414 93
      L 1539 156
      L 1660 93
      V 144
      L 1539 211
      L 1414 144
      Z
    "/>

    <!-- С -->
    <path fill="url(#whiteMetal)" d="
      M 2004 225
      H 2237
      V 291
      H 2005
      C 1933 291 1885 339 1885 422
      C 1885 505 1933 552 2005 552
      H 2237
      V 619
      H 2008
      C 1887 619 1818 546 1818 422
      C 1818 298 1887 225 2004 225
      Z
    "/>

    <!-- Оранжевая линия -->
    <rect x="2" y="771" width="2237" height="27" fill="url(#orangeMetal)"/>

    <!-- Нижняя строка -->
    <text
      x="0"
      y="945"
      fill="url(#whiteMetal)"
      font-family="Arial, Helvetica, sans-serif"
      font-size="126"
      font-weight="900"
      letter-spacing="22"
      text-rendering="geometricPrecision"
    >ЮРИДИЧЕСКАЯ КОМПАНИЯ</text>

  </g>
</svg>