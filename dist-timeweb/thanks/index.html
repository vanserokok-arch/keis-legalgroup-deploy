  <script>
    (function initThanksBack() {
      var goBack = function(event) {
        if (event) {
          event.preventDefault();
          event.stopPropagation();
        }

        try {
          var returnUrl = sessionStorage.getItem('thanksReturnUrl');
          if (returnUrl) {
            var returnHash = sessionStorage.getItem('thanksReturnHash') || '';
            var returnScrollY = sessionStorage.getItem('thanksReturnScrollY');
            var targetUrl = new URL(returnUrl, window.location.origin);
            if (targetUrl.origin === window.location.origin) {
              targetUrl.searchParams.set('thanksReturn', '1');
              if (!returnScrollY) targetUrl.hash = returnHash;
              window.location.href = targetUrl.pathname + targetUrl.search + targetUrl.hash;
              return;
            }
          }
        } catch (e) {
          // Fallback below.
        }

        window.location.href = '/';
      };

      var panel = document.querySelector('.keis-success-modal__panel');
      if (panel) {
        panel.addEventListener('click', function(event) {
          event.stopPropagation();
        });
      }

      document.querySelectorAll('[data-thanks-back]').forEach(function(element) {
        element.addEventListener('click', goBack);
      });
    })();
  </script>
